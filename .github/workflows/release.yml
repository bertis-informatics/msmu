name: Release

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Package changes are linted, tested, and built on PRs and branch pushes.
# Package and documentation deployments run only from Semantic Versioning Git
# tags with a v prefix that point at main.

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  release-gate:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Deployment tags must follow Semantic Versioning, for example v1.2.3."
            exit 1
          fi

          git fetch origin main --tags --force
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Deployment tags must point to commits reachable from main."
            exit 1
          fi

  deploy-python:
    name: Deploy Python Package
    runs-on: ubuntu-latest
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Deploy docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --config-file mkdocs.yml

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - deploy-python
      - deploy-docs
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The release body is the CHANGELOG section for this version -- what the maintainers actually
      # wrote -- with GitHub's generated pull-request list kept underneath, collapsed.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          python3 - "$VERSION" <<'PY' > changelog-section.md
          import re, sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[{re.escape(version)}\]:)",
              changelog,
              re.S | re.M,
          )
          if section is None:
              sys.exit(f"CHANGELOG.md has no section for version {version}")
          print(section.group(1).strip())
          PY

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG_NAME" --jq .body > generated-notes.md

          {
            cat changelog-section.md
            printf '\n\n<details>\n<summary>Merged pull requests</summary>\n\n'
            cat generated-notes.md
            printf '\n\n</details>\n'
          } > release-notes.md

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists"
          else
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file release-notes.md
          fi
